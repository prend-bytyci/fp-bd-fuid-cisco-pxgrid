services:
  pxgrid-service:
    container_name: pxgrid-service
    hostname: pxgrid-service
    image: docker.frcpnt.com/fp-fuid-cisco-ise-pxgrid:latest
    environment:
      - PXGRID_CLIENT_ACCOUNT_NAME=${PXGRID_CLIENT_ACCOUNT_NAME}
      - PXGRID_CLIENT_ACCOUNT_PASSWORD=${PXGRID_CLIENT_ACCOUNT_PASSWORD}
      - PXGRID_HOST_ADDRESS=${PXGRID_HOST_ADDRESS}
      - FUID_API_USERNAME=${FUID_API_USERNAME}
      - FUID_API_PASSWORD=${FUID_API_PASSWORD}
      - FUID_IP_ADDRESS=${FUID_IP_ADDRESS}
      - AD_LDAP_USER_DN=${AD_LDAP_USER_DN}
      - AD_LDAP_PASSWORD=${AD_LDAP_PASSWORD}
      - AD_LDAP_HOST=${AD_LDAP_HOST}
      - AD_DOMAIN_NAME=${AD_DOMAIN_NAME}
      - SESSION_LISTENER_INTERVAL_TIME=${SESSION_LISTENER_INTERVAL_TIME:-3}
      - SAVE_LOGS=${SAVE_LOGS:-false}
      - DISPLAY_INFO=${DISPLAY_INFO:-true}
      - INTERNAL_LOGS_FILE=/data/logs/fuid-ise.log
      - SESSION_LATEST_TIMESTAMP_PATH=/data/timestamp/latest
      - IGNORE_UNKNOWN_SESSIONS=${IGNORE_UNKNOWN_SESSIONS:-true}
      - ISE_PORT=${ISE_PORT:-8910}
      - FUID_PORT=${FUID_PORT:-5000}
      - AD_PORT=${AD_PORT:-636}
    volumes:
      - pxgrid-timestamp:/data/timestamp
      - pxgrid-logs:/data/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "fuid-ise"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pxgrid-timestamp:
  pxgrid-logs:
